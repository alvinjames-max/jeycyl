services:
  # 1. Go REST API Backend
  - type: web
    name: jeycyl-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /app/data/orders.db
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"

  # 2. Next.js Static Frontend
  - type: web
    name: jeycyl-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

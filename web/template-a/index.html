<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keepsafe - Minimal & Clean Commuter Safety (Template A)</title>
  <meta name="description" content="Community-driven Kenyan commuter safety platform. Real-time geofence alerts, incident reports, and instant SOS dispatch.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Kenyan Flag Brand Accent Line -->
  <div class="kenyan-flag-strip"></div>

  <!-- Top Navigation Header -->
  <header class="top-navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand-logo" title="Back to Template Switcher">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span>Keepsafe <span style="font-size: 0.75rem; font-weight: normal; color: var(--text-secondary); background: #e2e8f0; padding: 2px 8px; border-radius: 4px; margin-left: 4px;">Template A: Minimal</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><button class="nav-tab active" id="tab-map">🗺️ Live Safety Map</button></li>
          <li><button class="nav-tab" id="tab-report">➕ Report Incident</button></li>
          <li><button class="nav-tab" id="tab-switcher" onclick="window.location.href='../index.html'">🔄 Switch Template</button></li>
        </ul>
      </nav>

      <button class="header-sos-btn pulse-sos" id="btn-header-sos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
        </svg>
        EMERGENCY SOS
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content" id="main-container">
    <!-- Content dynamically injected by app.js -->
  </main>

  <!-- Floating Emergency SOS Button -->
  <button class="floating-sos-pill pulse-sos" id="btn-floating-sos">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <span>INSTANT SOS DISPATCH</span>
  </button>

  <!-- Dynamic Modal Backdrop -->
  <div id="modal-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Jeycyl Cakes</title>
  <meta name="description" content="Jeycyl Cakes admin panel login." />
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    body {
      background: var(--brown-950);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(212,168,67,.18), transparent 70%);
      top: -200px; left: -200px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(122,59,0,.4), transparent 70%);
      bottom: -100px; right: -100px;
    }
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: rgba(255,255,255,.98);
      border-radius: var(--radius-xl);
      padding: 3rem;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
    }
    .login-logo { text-align: center; margin-bottom: 2.5rem; }
    .login-logo .nav-logo { font-size: 2.2rem; display: inline-block; }
    .login-logo .badge {
      display: inline-block;
      background: rgba(212,168,67,.12);
      border: 1px solid rgba(212,168,67,.3);
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .3rem .9rem;
      border-radius: 100px;
      margin-top: .75rem;
    }
    .login-card h2 { font-size: 1.5rem; margin-bottom: .35rem; }
    .login-card .sub { color: var(--text-muted); font-size: .88rem; margin-bottom: 2rem; }
    #login-error {
      display: none;
      background: #fce8e8;
      color: #b71c1c;
      padding: .75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: .88rem;
      margin-bottom: 1rem;
      border-left: 3px solid #e53935;
    }
    .back-link { display: block; text-align: center; margin-top: 1.75rem; color: var(--text-muted); font-size: .85rem; }
    .back-link a { color: var(--gold); font-weight: 600; }
    .login-footer-note {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--cream-dark);
      font-size: .78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="nav-logo">Jeycyl<span>Cakes</span></div>
        <div class="badge">Admin Panel</div>
      </div>
      <h2>Welcome back</h2>
      <p class="sub">Sign in to manage your orders, cakes, and customers.</p>
      <div id="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:.5rem" id="login-btn">
          Sign In →
        </button>
      </form>
      <p class="back-link"><a href="../index.html">← Back to Jeycyl Cakes</a></p>
      <div class="login-footer-note">🔒 Secure admin access. Unauthorised access is prohibited.</div>
    </div>
  </div>

  <script type="module">
  import { login } from '../shared/api.js';

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      await login(
        document.getElementById('username').value,
        document.getElementById('password').value,
      );
      window.location.href = './dashboard.html';
    } catch (ex) {
      err.style.display = 'block';
      err.textContent = 'Invalid credentials. Please try again.';
      btn.disabled = false; btn.textContent = 'Sign In →';
    }
  });
  </script>
</body>
</html>
